name: site

on:
  push:
    paths: ["materials/**", "tools/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Migrate case 1 from butt-lab (idempotent)
        run: |
          if [ ! -f materials/cigarette-butts/material.yaml ]; then
            git clone --depth 1 https://github.com/abdo2048/butt-lab /tmp/butt-lab
            python3 tools/migrate-case1.py /tmp/butt-lab .
          else
            echo "material already migrated — skipping"
          fi

      - name: Build the site
        run: |
          pip install --quiet markdown pyyaml
          python3 tools/site-builder/build.py .

      - name: Commit rendered site + migrated material
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "build: migrate case 1 from butt-lab + render site [skip ci]"
            git push
          fi
